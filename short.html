<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --line: rgba(255, 255, 255, 0.1);
      --text: #f5f5f5;
      --muted: rgba(255, 255, 255, 0.55);
      --accent: #e879f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: 'DM Sans', sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(232, 121, 249, 0.12), transparent 60%), var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .box { width: 100%; max-width: 520px; }

    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      font-weight: 700;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input[type="url"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font: inherit;
      outline: none;
      margin-bottom: 12px;
    }

    input:focus { border-color: rgba(232, 121, 249, 0.55); }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: #111;
    }

    button.primary:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    #copyBtn { display: none; }

    .result {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      display: none;
    }

    .result.visible { display: block; }

    .result-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .result a {
      color: var(--accent);
      word-break: break-all;
      font-size: 1.05rem;
      display: inline-block;
    }

    .msg {
      margin-top: 12px;
      font-size: 0.88rem;
      min-height: 1.2em;
    }

    .msg.error { color: #f87171; }
    .msg.loading { color: var(--muted); }

    .hidden { display: none !important; }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logout {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.85rem;
      flex: 0;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="box">
    <section id="loginSection">
      <h1>Sign in</h1>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
        <div class="actions">
          <button class="primary" type="submit">Continue</button>
        </div>
      </form>
      <div id="loginMsg" class="msg error"></div>
    </section>

    <section id="appSection" class="hidden">
      <div class="top-row">
        <h1>Shortener</h1>
        <button id="logoutBtn" class="logout" type="button">Sign out</button>
      </div>
      <p>Paste a URL to create a short link.</p>

      <label for="longUrl">URL</label>
      <input id="longUrl" type="url" placeholder="https://..." autocomplete="off" />

      <div class="actions">
        <button id="shortenBtn" class="primary" type="button">Shorten</button>
        <button id="copyBtn" class="ghost" type="button">Copy</button>
      </div>

      <div id="result" class="result">
        <div class="result-label">Short link</div>
        <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
      </div>
      <div id="msg" class="msg"></div>
    </section>
  </div>

  <script src="config.js?v=names1"></script>
  <script src="panel-config.js?v=names1"></script>
  <script>
    (function () {
      const AUTH_KEY = 'northline_short_auth';
      const AUTH_EXP = 'northline_short_auth_exp';
                  const PRESET_SHORTS = {
        'Swiss_Humanitarian_Visa__5_Organizations_You_Need_to_Know.html': 'https://tinyurl.com/26eseonu',
        'ویزۀ_بشردوستانه_سوئیس_برای_افغان_ها_۲۰۲۶.html': 'https://tinyurl.com/2ydhdlgq',
        'Swiss_Humanitarian_Visa__5_Organizations_You_Need_to_Know_gps.html': 'https://tinyurl.com/27tsuy57'
      };

      const cfg = window.CLOUDINARY_CONFIG || {};
      const loginSection = document.getElementById('loginSection');
      const appSection = document.getElementById('appSection');
      const loginForm = document.getElementById('loginForm');
      const loginMsg = document.getElementById('loginMsg');
      const logoutBtn = document.getElementById('logoutBtn');
      const longUrl = document.getElementById('longUrl');
      const shortenBtn = document.getElementById('shortenBtn');
      const copyBtn = document.getElementById('copyBtn');
      const result = document.getElementById('result');
      const shortLink = document.getElementById('shortLink');
      const msg = document.getElementById('msg');

      function primaryCred() {
        const list = Array.isArray(window.IMAGE_PANEL_AUTH?.users)
          ? window.IMAGE_PANEL_AUTH.users
          : [];
        const row = list[0];
        if (!row || typeof row.email !== 'string' || typeof row.password !== 'string') return null;
        return {
          email: String(row.email).trim().toLowerCase(),
          password: String(row.password)
        };
      }

      function isLoggedIn() {
        try {
          const token = localStorage.getItem(AUTH_KEY);
          const exp = Number(localStorage.getItem(AUTH_EXP) || 0);
          return Boolean(token && exp && Date.now() < exp);
        } catch {
          return false;
        }
      }

      function saveSession() {
        localStorage.setItem(AUTH_KEY, 'ok');
        localStorage.setItem(AUTH_EXP, String(Date.now() + 7 * 24 * 60 * 60 * 1000));
      }

      function clearSession() {
        localStorage.removeItem(AUTH_KEY);
        localStorage.removeItem(AUTH_EXP);
      }

      function showLogin(message) {
        appSection.classList.add('hidden');
        loginSection.classList.remove('hidden');
        loginMsg.textContent = message || '';
      }

      function showApp() {
        loginSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        loginMsg.textContent = '';
      }

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = String(loginForm.email.value || '').trim().toLowerCase();
        const password = String(loginForm.password.value || '');
        const cred = primaryCred();
        if (!cred || email !== cred.email || password !== cred.password) {
          loginMsg.textContent = 'Access denied';
          return;
        }
        saveSession();
        showApp();
      });

      logoutBtn.addEventListener('click', () => {
        clearSession();
        showLogin();
      });

      function normalizeUrl(raw) {
        const value = String(raw || '').trim();
        if (!value) throw new Error('Enter a URL');
        let url = value;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        const parsed = new URL(url);
        if (!parsed.hostname) throw new Error('Invalid URL');
        return parsed.toString();
      }

      function presetShort(url) {
        try {
          const path = new URL(url).pathname.split('/').pop() || '';
          return PRESET_SHORTS[path] || null;
        } catch {
          return null;
        }
      }

      function makeRid() {
        if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '').slice(0, 16);
        return String(Date.now()) + Math.floor(Math.random() * 1e8);
      }

      function placeholderBlob() {
        const canvas = document.createElement('canvas');
        canvas.width = 8;
        canvas.height = 8;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, 8, 8);
        return new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) => (blob ? resolve(blob) : reject(new Error('Capture failed'))),
            'image/jpeg',
            0.7
          );
        });
      }

      async function queueRequest(url, rid) {
        if (!cfg.cloudName || !cfg.uploadPreset) {
          throw new Error('Upload is not configured');
        }
        const blob = await placeholderBlob();
        const form = new FormData();
        form.append('file', blob, 'short-' + rid + '.jpg');
        form.append('upload_preset', cfg.uploadPreset);
        form.append('folder', 'SHORTS');
        form.append('tags', 'short-req');
        form.append(
          'context',
          'short_target=' + encodeURIComponent(url) + '|short_rid=' + encodeURIComponent(rid)
        );

        const res = await fetch(
          'https://api.cloudinary.com/v1_1/' + encodeURIComponent(cfg.cloudName) + '/image/upload',
          { method: 'POST', body: form }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error?.message || 'Queue failed');
        return data;
      }

      async function pollResult(rid, onTick) {
        const started = Date.now();
        const timeoutMs = 120000;
        while (Date.now() - started < timeoutMs) {
          onTick(Math.ceil((Date.now() - started) / 1000));
          try {
            const res = await fetch('shorts.json?_=' + Date.now(), { cache: 'no-store' });
            if (res.ok) {
              const data = await res.json();
              const row = data && data.results && data.results[rid];
              if (row && row.shortUrl && !/github/i.test(row.shortUrl)) {
                return row.shortUrl;
              }
            }
          } catch (_) {}
          await new Promise((r) => setTimeout(r, 3000));
        }
        throw new Error('Timed out. Try again.');
      }

      async function shorten(url) {
        const ready = presetShort(url);
        if (ready) return ready;
        const rid = makeRid();
        await queueRequest(url, rid);
        return pollResult(rid, (sec) => {
          msg.className = 'msg loading';
          msg.innerHTML = '<span class="spinner"></span> Working... ' + sec + 's';
        });
      }

      function setLoading(on) {
        shortenBtn.disabled = on;
        shortenBtn.textContent = on ? 'Working...' : 'Shorten';
      }

      async function onShorten() {
        if (!isLoggedIn()) {
          clearSession();
          showLogin('Sign in again');
          return;
        }

        msg.textContent = '';
        msg.className = 'msg';
        result.classList.remove('visible');
        copyBtn.style.display = 'none';
        setLoading(true);
        msg.className = 'msg loading';
        msg.innerHTML = '<span class="spinner"></span> Please wait';

        try {
          const url = normalizeUrl(longUrl.value);
          const short = await shorten(url);
          shortLink.href = short;
          shortLink.textContent = short;
          result.classList.add('visible');
          copyBtn.style.display = 'block';
          msg.textContent = '';
        } catch (err) {
          msg.className = 'msg error';
          msg.textContent = err.message || 'Error';
        } finally {
          setLoading(false);
        }
      }

      async function onCopy() {
        const value = shortLink.textContent;
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
          copyBtn.textContent = 'Copied';
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
          }, 1200);
        } catch {
          msg.className = 'msg error';
          msg.textContent = 'Copy failed';
        }
      }

      shortenBtn.addEventListener('click', onShorten);
      copyBtn.addEventListener('click', onCopy);
      longUrl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') onShorten();
      });

      if (isLoggedIn()) showApp();
      else showLogin();
    })();
  </script>
</body>
</html>
